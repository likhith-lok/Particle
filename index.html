<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050609">
    <meta name="description" content="An interactive, generative field of light.">
    <title>Particle — A Field of Light</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="experience">
        <canvas id="canvas" aria-hidden="true"></canvas>

        <header class="topbar">
            <div class="wordmark">
                <span class="wordmark__symbol" aria-hidden="true"></span>
                <span>PARTICLE<span class="wordmark__divider">|</span>STUDIES</span>
            </div>

            <div class="header-tools">
                <div class="metrics" role="group" aria-label="Simulation statistics">
                    <div class="metric">
                        <span class="metric__label">Particles</span>
                        <span class="metric__value" id="particle-count">000</span>
                    </div>
                    <span class="metrics__divider" aria-hidden="true"></span>
                    <div class="metric">
                        <span class="metric__label">Frame rate</span>
                        <span class="metric__value" id="fps">--</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button
                        class="fullscreen-toggle"
                        id="fullscreen-toggle"
                        type="button"
                        aria-label="Enter fullscreen"
                        title="Enter fullscreen"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path id="fullscreen-icon" d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"></path>
                        </svg>
                    </button>
                    <button
                        class="interaction-toggle"
                        id="interaction-toggle"
                        type="button"
                        aria-label="Disable pointer interaction"
                        aria-pressed="true"
                        title="Disable pointer interaction"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2.75a5 5 0 0 0-5 5v8.5a5 5 0 0 0 10 0v-8.5a5 5 0 0 0-5-5Z"></path>
                            <path d="M12 3v6"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <section class="intro" aria-labelledby="title">
            <h1 id="title">A field of<br><span>living light.</span></h1>
        </section>

        <div class="density-control">
            <div class="density-control__heading">
                <label for="particle-density">Particle density</label>
                <output id="density-value" for="particle-density">500</output>
            </div>
            <input
                id="particle-density"
                type="range"
                min="100"
                max="5000"
                step="50"
                value="500"
                aria-label="Number of particles"
            >
            <p class="mobile-recommendation">500 particles recommended <br> enter fullscreen for better results</p>
        </div>

        <footer class="bottombar">
            <div class="interaction-hint">
                <span>Move or touch to explore</span>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
